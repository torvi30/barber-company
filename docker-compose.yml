version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: barberpulse_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_ORIGIN=http://localhost
      - USE_MOCK_FIRESTORE=true
    networks:
      - barberpulse_network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: barberpulse_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - barberpulse_network

networks:
  barberpulse_network:
    driver: bridge

